name: Команды issue
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  command:
    if: github.event.comment.author_association == 'OWNER' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const issue = { ...context.repo, issue_number: context.issue.number };
            const text = context.payload.comment.body.trim();
            const assign = text.match(/^\/assign @([a-z\d][a-z\d-]{0,38})$/i);
            const label = text.match(/^\/label (bug|feature|tech-debt)$/);
            const due = text.match(/^\/due (\d{4}-\d{2}-\d{2})$/);

            if (assign) {
              await github.rest.issues.addAssignees({ ...issue, assignees: [assign[1]] });
            } else if (label) {
              await github.rest.issues.addLabels({ ...issue, labels: [label[1]] });
            } else if (due) {
              const date = new Date(due[1] + 'T00:00:00Z');
              if (Number.isNaN(date.valueOf()) || date.toISOString().slice(0, 10) !== due[1]) {
                core.setFailed('Укажите существующую дату в формате ГГГГ-ММ-ДД.');
                return;
              }
              const current = await github.rest.issues.get(issue);
              const line = 'Срок выполнения: ' + due[1];
              const deadline = /^Срок выполнения: \d{4}-\d{2}-\d{2}$/m;
              const body = current.data.body || '';
              await github.rest.issues.update({
                ...issue,
                body: deadline.test(body) ? body.replace(deadline, line) : (body.trimEnd() + '\n\n' + line).trimStart()
              });
            }
